services:
  - type: web
    name: sahaanket-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: Postgres
      - key: DatabaseUrl
        sync: false
      - key: DOTNET_gcServer
        value: "0"
      - key: DOTNET_GCConserveMemory
        value: "9"
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: SurveyAdminApi
      - key: JwtSettings__Audience
        value: SurveyAdminClients
    healthCheckPath: /health
