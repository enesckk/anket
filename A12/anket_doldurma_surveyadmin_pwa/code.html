<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Anket Doldurma Ekranı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#e2dfe1",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#636264",
                        "on-error-container": "#93000a",
                        "surface": "#ffffff",
                        "error": "#d70015",
                        "tertiary": "#762e00",
                        "outline-variant": "#c2c6d4",
                        "surface-container-lowest": "#ffffff",
                        "warning": "#b25000",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f0f2",
                        "secondary-fixed": "#e4e2e4",
                        "tertiary-fixed": "#ffdbcc",
                        "outline": "#727783",
                        "text-muted": "#86868b",
                        "on-primary-fixed": "#001b3f",
                        "on-surface-variant": "#424752",
                        "on-tertiary": "#ffffff",
                        "text-secondary": "#6e6e73",
                        "on-background": "#1a1c1d",
                        "success": "#248a3d",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#7a3000",
                        "on-tertiary-fixed": "#351000",
                        "surface-container": "#eeeef0",
                        "tertiary-container": "#9b3f01",
                        "primary-fixed": "#d7e3ff",
                        "border": "#e5e5ea",
                        "primary-fixed-dim": "#abc7ff",
                        "on-surface": "#1a1c1d",
                        "inverse-surface": "#2f3132",
                        "primary-container": "#0059b5",
                        "inverse-primary": "#abc7ff",
                        "primary": "#004289",
                        "separator": "#f0f0f2",
                        "secondary": "#5f5e60",
                        "on-secondary-fixed-variant": "#474649",
                        "background": "#f9f9fb",
                        "surface-container-high": "#e8e8ea",
                        "on-tertiary-container": "#ffc8af",
                        "secondary-fixed-dim": "#c8c6c8",
                        "tertiary-fixed-dim": "#ffb693",
                        "surface-container-highest": "#e2e2e4",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#00458f",
                        "surface-variant": "#e2e2e4",
                        "surface-dim": "#d9dadc",
                        "surface-tint": "#0b5cb8",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-primary-container": "#c0d4ff",
                        "surface-container-low": "#f3f3f5",
                        "surface-bright": "#f9f9fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "xs": "4px",
                        "xxl": "48px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "title-md": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["13px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pb-[80px]">
<!-- App Bar (Contextual/Task-Focused) -->
<header class="sticky top-0 w-full bg-surface/90 backdrop-blur-md border-b border-border h-14 z-50">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-full max-w-4xl mx-auto">
<button class="p-2 -ml-2 text-on-surface hover:bg-surface-container-low rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface truncate px-4">
                Üretici İhtiyaç Anketi
            </h1>
<div class="flex items-center gap-1 text-success bg-success/10 px-3 py-1 rounded-full">
<span class="material-symbols-outlined" style="font-size: 16px;">cloud_done</span>
<span class="font-label-sm text-label-sm">Kaydedildi</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full px-margin-mobile md:px-margin-desktop py-lg max-w-4xl mx-auto">
<!-- Step Indicator -->
<div class="mb-lg">
<div class="flex justify-between items-end mb-sm">
<h2 class="font-title-lg text-title-lg text-primary">Kişisel Bilgiler</h2>
<span class="font-label-md text-label-md text-text-secondary">Adım 1 / 4</span>
</div>
<div class="w-full bg-surface-container h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full w-1/4 transition-all duration-500"></div>
</div>
</div>
<!-- Survey Form Card -->
<div class="bg-surface rounded-xl border border-border shadow-sm p-md md:p-lg space-y-xl">
<!-- Question 1: Text Input -->
<div class="space-y-sm">
<label class="block font-title-md text-title-md text-on-surface" for="fullName">
                    1. Ad Soyad
                </label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-on-surface placeholder:text-text-secondary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="fullName" placeholder="Adınızı yazın" type="text"/>
</div>
<hr class="border-t border-separator"/>
<!-- Question 2: Big Selection -->
<div class="space-y-sm">
<label class="block font-title-md text-title-md text-on-surface mb-md">
                    2. Araziniz var mı?
                </label>
<div class="grid grid-cols-2 gap-md">
<!-- Option: Evet (Active State Example) -->
<label class="relative flex flex-col items-center justify-center p-lg border-2 border-primary bg-primary/5 rounded-xl cursor-pointer active:scale-95 transition-all">
<input checked="" class="sr-only" name="land" type="radio" value="yes"/>
<span class="material-symbols-outlined text-primary mb-2" style="font-size: 32px; font-variation-settings: 'FILL' 1;">landscape</span>
<span class="font-title-md text-title-md text-primary">Evet</span>
</label>
<!-- Option: Hayır -->
<label class="relative flex flex-col items-center justify-center p-lg border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low hover:border-outline active:scale-95 transition-all">
<input class="sr-only" name="land" type="radio" value="no"/>
<span class="material-symbols-outlined text-on-surface-variant mb-2" style="font-size: 32px;">block</span>
<span class="font-title-md text-title-md text-on-surface-variant">Hayır</span>
</label>
</div>
</div>
<hr class="border-t border-separator"/>
<!-- Question 3: Photo Upload -->
<div class="space-y-sm">
<label class="block font-title-md text-title-md text-on-surface">
                    3. Fotoğraf Ekle
                </label>
<p class="font-body-md text-body-md text-text-secondary mb-md">Arazi veya üretim alanınızı gösteren bir fotoğraf ekleyebilirsiniz.</p>
<button class="w-full flex flex-col items-center justify-center py-xl border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low hover:border-primary transition-colors group active:scale-[0.98]">
<div class="bg-surface-container p-3 rounded-full mb-3 group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-text-secondary group-hover:text-primary transition-colors" style="font-size: 28px;">add_a_photo</span>
</div>
<span class="font-title-md text-title-md text-primary">Kamera ile Çek</span>
<span class="font-label-md text-label-md text-text-secondary mt-1">veya galeriden seç</span>
</button>
</div>
</div>
</main>
<!-- Bottom Action Bar (Contextual) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border z-50">
<!-- Safe area padding for mobile -->
<div class="max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop py-md flex gap-md pb-safe">
<button class="flex-1 py-3 px-6 rounded-full border border-outline-variant text-on-surface font-title-md text-title-md text-center hover:bg-surface-container-low active:scale-95 transition-all">
                Geri
            </button>
<button class="flex-[2] py-3 px-6 rounded-full bg-primary text-on-primary font-title-md text-title-md text-center shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
                Devam Et
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</div>
<!-- Optional: Add safe area spacing utility for iOS -->
<style>
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe {
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            }
        }
    </style>
</body></html>
