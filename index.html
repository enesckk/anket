<!DOCTYPE html>
<html lang="tr" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>SurveyAdmin Intelligence - Saha Anket & Executive Admin Platformu</title>
  <meta name="description" content="Saha anket yönetimi, PWA anket doldurma, çevrimdışı senkronizasyon ve executive admin data intelligence platformu."/>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles.css"/>

  <!-- Tailwind Theme Configuration -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "navy": "#01214A",
            "navy-light": "#0a2f5c",
            "primary": "#2A9D38",
            "primary-dark": "#22822e",
            "accent-blue": "#00A0DF",
            "accent-blue-light": "#e0f2fe",
            "background": "#F4F7F9",
            "surface": "#FFFFFF",
            "on-surface": "#01214A",
            "text-secondary": "#64748B",
            "text-muted": "#94A3B8",
            "border": "#E2E8F0",
            "separator": "#F1F5F9"
          },
          boxShadow: {
            "card": "0 4px 20px -2px rgba(1, 33, 74, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)",
            "card-hover": "0 10px 25px -3px rgba(1, 33, 74, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03)",
            "header": "0 2px 10px rgba(1, 33, 74, 0.03)"
          },
          fontFamily: {
            sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            display: ["Inter", "sans-serif"]
          },
          borderRadius: {
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.25rem"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">
  <div id="app"></div>

  <!-- Main Application Script -->
  <script type="module" src="./app.js"></script>
</body>
</html>
