            "navy-light": "#0a2f5c",
            "primary": "#2A9D38",
            "primary-dark": "#22822e",

            "accent-blue-light": "#e0f2fe",
            "background": "#F4F7F9",
            "surface": "#FFFFFF",

            "text-muted": "#94A3B8",
            "border": "#E2E8F0",

          },
          boxShadow: {
            "card": "0 4px 20px -2px rgba(1, 33, 74, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)",
            "card-hover": "0 10px 25px -3px rgba(1, 33, 74, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03)",
            "header": "0 2px 10px rgba(1, 33, 74, 0.03)"

<body class="bg-background text-on-surface antialiased min-h-screen">
  <div id="app"></div>

  <!-- Main Application Script -->
  <script type="module" src="./app.js?v=18"></script>

  <!-- Service Worker Registration + PWA Yükleme Butonu -->
  <script>
    let deferredPrompt = null;

    // PWA yükleme butonunu göster
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'flex';
    });

    // Yükleme tamamlandığında butonu gizle
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
      deferredPrompt = null;
    });

    // Butona tıklanınca yükleme dialogunu aç
    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        const btn = document.getElementById('pwa-install-btn');
        if (btn) btn.style.display = 'none';
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then((reg) => {
            console.log('[PWA] Service Worker registered. Scope:', reg.scope);
            reg.update();
          })
          .catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      });
    }
  </script>

  <!-- PWA Yükleme Butonu (otomatik görünür) -->
  <button id="pwa-install-btn" onclick="installPWA()" style="
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    align-items: center;
    gap: 10px;
    background: #01214A;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    font-family: Inter, sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(1,33,74,0.35);
    z-index: 9999;
    letter-spacing: 0.01em;
    transition: transform 0.2s, box-shadow 0.2s;
  "
  onmouseover="this.style.transform='translateX(-50%) scale(1.04)';this.style.boxShadow='0 12px 40px rgba(1,33,74,0.45)'"
  onmouseout="this.style.transform='translateX(-50%) scale(1)';this.style.boxShadow='0 8px 32px rgba(1,33,74,0.35)'">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    Uygulamayı Masaüstüne Ekle
  </button>
</body>
